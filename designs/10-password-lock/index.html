#win{position:absolute;left:40px;top:1400px;width:1000px;height:440px;box-sizing:border-box;z-index:30;

<body>
  <div id="viewport">
    <!-- Top Title (y=150..330) -->

<div id="hl"></div><pre id="code"></pre></div>

  <script>
(function () {
  const TAU = Math.PI * 2, T = 6;
  const viewport = document.getElementById('viewport');
  function fitViewport() { const s = Math.min(window.innerWidth / 1080, window.innerHeight / 1920); viewport.style.transform = `scale(${s})`; }
  window.addEventListener('resize', fitViewport); fitViewport();
  const ctx = document.getElementById('stage-canvas').getContext('2d');
  const hl = document.getElementById('code-highlight'), badge = document.getElementById('phase-badge');
  const lineEls = document.querySelectorAll('.code-line');
  const CX = 540, CY = 880;
  const FONT = '"Oswald","Bebas Neue",Impact,"Arial Narrow",sans-serif';
  const MONO = '"SFMono-Regular","JetBrains Mono","Fira Code",Consolas,monospace';
  const SANS = '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
  const eo = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
  const eio = x => { const c = clamp(x, 0, 1); return c < 0.5 ? 4 * c * c * c : 1 - Math.pow(-2 * c + 2, 3) / 2; };
  const eob = x => { const c = clamp(x, 0, 1), c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(c - 1, 3) + c1 * Math.pow(c - 1, 2); };
  const sstep = (a, b, x) => { const c = clamp((x - a) / (b - a), 0, 1); return c * c * (3 - 2 * c); };
  const fract = x => x - Math.floor(x);
  function prng(seed) { let a = seed >>> 0; return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function rr(c, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  function star(x, y, r, color, alpha, rot) {
    if (alpha <= 0.005 || r <= 0.2) return;
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha = clamp(alpha, 0, 1); ctx.fillStyle = color;
    ctx.beginPath(); for (let i = 0; i < 8; i++) { const rad = i % 2 === 0 ? r : r * 0.25, a = i * Math.PI / 4; const px = Math.cos(a) * rad, py = Math.sin(a) * rad; if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  function glass(x, y, w, h, r, o) {
    o = o || {};
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.75)'; ctx.shadowBlur = o.blur || 50; ctx.shadowOffsetY = 20; rr(ctx, x, y, w, h, r); ctx.fillStyle = 'rgba(14,19,32,.7)'; ctx.fill(); ctx.restore();
    ctx.save(); rr(ctx, x, y, w, h, r); ctx.clip();
    const g = ctx.createLinearGradient(x, y, x + w, y + h);
    g.addColorStop(0, 'rgba(255,255,255,' + (o.a || 0.14) + ')'); g.addColorStop(0.5, 'rgba(168,230,255,.07)'); g.addColorStop(1, 'rgba(196,181,253,.11)');
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h); ctx.restore();
    rr(ctx, x, y, w, h, r); ctx.strokeStyle = o.stroke || 'rgba(255,255,255,.28)'; ctx.lineWidth = o.lw || 2; ctx.stroke();
  }
  function txt(s, x, y, font, fill, glow, align) {
    ctx.save(); ctx.font = font; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
    if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 18; } ctx.fillStyle = fill; ctx.fillText(s, x, y); ctx.restore();
  }
  function mix(a, b, t) { return `rgb(${Math.round(lerp(a[0], b[0], t))},${Math.round(lerp(a[1], b[1], t))},${Math.round(lerp(a[2], b[2], t))})`; }
  function ribbons(t) {
    const th = (t / T) * TAU;
    ctx.save();
    const bg = ctx.createRadialGradient(CX + Math.sin(th) * 55, CY + Math.cos(th) * 45, 40, CX, CY, 620);
    bg.addColorStop(0, 'rgba(168,230,255,.17)'); bg.addColorStop(0.45, 'rgba(196,181,253,.11)'); bg.addColorStop(0.75, 'rgba(245,194,231,.05)'); bg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = bg; ctx.fillRect(0, 320, 1080, 1120);
    ctx.filter = 'blur(44px)'; ctx.globalCompositeOperation = 'screen';
    const rb = [
      { a: 'rgba(168,230,255,.62)', b: 'rgba(125,211,252,.15)', y: 630, a1: 115, a2: 85, o: 0, w: 130 },
      { a: 'rgba(245,194,231,.56)', b: 'rgba(251,207,232,.15)', y: 880, a1: -125, a2: 95, o: 2.1, w: 145 },
      { a: 'rgba(196,181,253,.58)', b: 'rgba(167,139,250,.16)', y: 1120, a1: 95, a2: -115, o: 4.2, w: 130 }];
    for (const r of rb) {
      const p = th + r.o;
      const g = ctx.createLinearGradient(0, r.y - 150, 1080, r.y + 150); g.addColorStop(0, r.b); g.addColorStop(0.5, r.a); g.addColorStop(1, r.b);
      ctx.strokeStyle = g; ctx.lineWidth = r.w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-120, r.y + Math.sin(p) * r.a1);
      ctx.bezierCurveTo(340 + Math.cos(p) * 90, r.y + Math.cos(p + 0.8) * r.a2, 740 + Math.sin(p) * 90, r.y + Math.sin(p - 0.8) * r.a1, 1200, r.y + Math.cos(p) * r.a2); ctx.stroke();
    }
    ctx.restore();
  }
  const PWL = 11, FX = 120, FW = 840;
  function sc(s) { return s < 0.4 ? mix([248, 113, 113], [251, 191, 36], s / 0.4) : s < 0.75 ? mix([251, 191, 36], [52, 211, 153], (s - 0.4) / 0.35) : 'rgb(52,211,153)'; }
  function lock(cl, pulse) {
    const lift = (1 - cl) * 38, sw = (1 - cl) * -0.55, g = clamp(cl, 0, 1);
    ctx.save();
    ctx.save(); ctx.translate(36, -48 - lift); ctx.rotate(sw); ctx.translate(-36, 48);
    ctx.strokeStyle = mix([226, 244, 255], [110, 231, 183], g); ctx.lineWidth = 16; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-36, -48); ctx.lineTo(-36, -78); ctx.arc(0, -78, 36, Math.PI, 0); ctx.lineTo(36, -48); ctx.stroke(); ctx.restore();
    const gr = ctx.createLinearGradient(-75, -48, 75, 72); gr.addColorStop(0, mix([196, 181, 253], [52, 211, 153], g)); gr.addColorStop(1, mix([168, 230, 255], [16, 185, 129], g));
    ctx.shadowColor = g > 0.5 ? 'rgba(52,211,153,.8)' : 'rgba(168,230,255,.5)'; ctx.shadowBlur = 30; rr(ctx, -75, -48, 150, 120, 22); ctx.fillStyle = gr; ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(5,16,29,.85)'; ctx.beginPath(); ctx.arc(0, 8, 14, 0, TAU); ctx.fill(); rr(ctx, -5, 14, 10, 28, 4); ctx.fill();
    ctx.restore();
  }
  function draw(t) {
    const up = eio((t - 5.2) / 0.4), n = Math.floor(clamp((t - 0.35) / 1.9, 0, 1) * PWL * (1 - up) + 0.0001), s = n / PWL;
    txt('PASSWORD', FX + 6, 612, '600 20px ' + MONO, 'rgba(226,244,255,.55)', null, 'left');
    glass(FX, 650, FW, 120, 32, { stroke: 'rgba(168,230,255,.45)' });
    ctx.save(); for (let i = 0; i < n; i++) { const age = Math.max(0, t - (0.35 + (i / PWL) * 1.9)), pop = age < 0.12 ? 1 + 0.35 * Math.sin(age / 0.12 * Math.PI) : 1; ctx.save(); ctx.translate(FX + 56 + i * 46, 710); ctx.scale(pop, pop); ctx.fillStyle = '#fff'; ctx.shadowColor = '#a8e6ff'; ctx.shadowBlur = 12; ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.fill(); ctx.restore(); }
    if (t > 0.3 && t < 2.35 && Math.floor(t * 4) % 2 === 0) { ctx.fillStyle = '#a8e6ff'; ctx.fillRect(FX + 44 + n * 46, 686, 4, 48); } ctx.restore();
    rr(ctx, FX, 830, FW, 16, 8); ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fill();
    if (s > 0.01) { rr(ctx, FX, 830, Math.max(16, FW * s), 16, 8); ctx.save(); ctx.shadowColor = sc(s); ctx.shadowBlur = 16; ctx.fillStyle = sc(s); ctx.fill(); ctx.restore(); }
    txt(s < 0.01 ? '' : s < 0.4 ? 'WEAK' : s < 0.75 ? 'MEDIUM' : 'STRONG', FX, 880, '700 24px ' + MONO, sc(s), null, 'left');
    txt(Math.round(s * 100) + '%', FX + FW, 880, '600 22px ' + MONO, 'rgba(226,244,255,.6)', null, 'right');
    const cl = Math.max(0, eob((t - 2.7) / 0.5) - eio((t - 5.3) / 0.5));
    const sh = clamp(cl, 0, 1) * (1 - 0);
    ctx.save(); ctx.translate(CX, 1130);
    if (sh > 0.01) {
      const pu = 1 + 0.05 * Math.sin(TAU * 3 * t / T), rg = ctx.createRadialGradient(0, 0, 40, 0, 0, 230); rg.addColorStop(0, 'rgba(52,211,153,' + 0.35 * sh + ')'); rg.addColorStop(1, 'rgba(52,211,153,0)'); ctx.fillStyle = rg; ctx.fillRect(-260, -260, 520, 520);
      ctx.save(); ctx.scale(pu, pu); ctx.globalAlpha = sh; ctx.beginPath(); ctx.moveTo(0, -150); ctx.lineTo(115, -108); ctx.bezierCurveTo(115, 46, 66, 112, 0, 150); ctx.bezierCurveTo(-66, 112, -115, 46, -115, -108); ctx.closePath();
      ctx.fillStyle = 'rgba(52,211,153,.1)'; ctx.fill(); ctx.strokeStyle = '#34d399'; ctx.lineWidth = 6; ctx.shadowColor = '#34d399'; ctx.shadowBlur = 28; ctx.stroke(); ctx.restore();
    }
    ctx.translate(0, 14); lock(cl, 0); ctx.restore();
    ctx.save(); ctx.globalAlpha = clamp(sh * 1.4, 0, 1); txt('ENCRYPTED • LOCKED', CX, 1318, '700 26px ' + MONO, '#6ee7b7', 'rgba(52,211,153,.6)'); ctx.restore();
    ctx.save(); ctx.globalAlpha = 1 - clamp(sh * 2, 0, 1); txt('UNLOCKED', CX, 1318, '600 24px ' + MONO, 'rgba(226,244,255,.5)'); ctx.restore();
  }
  const PH = [[0.35, 0, 'IDLE'], [2.25, 3, 'TYPING'], [2.7, 2, 'SCORING'], [3.4, 4, 'LOCKING'], [5.2, 5, 'SECURED'], [5.9, 6, 'RESET'], [6, 0, 'LOOP RESET']];
  function updateCode(t) {
    let t0 = 0, l0 = 0, lineF = 0, label = PH[0][2];
    for (const [te, le, lb] of PH) { if (t <= te) { lineF = l0 + (le - l0) * eio((t - t0) / (te - t0)); label = lb; break; } t0 = te; l0 = le; }
    hl.style.transform = `translateY(${lineF * 31}px)`; badge.textContent = label;
    const a = Math.round(lineF); for (let i = 0; i < lineEls.length; i++) lineEls[i].style.opacity = i === a ? '1' : '0.58';
  }
  window.renderAt = function (tin) {
    let t = Number(tin) % T; if (t < 0) t += T;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
    ctx.clearRect(0, 0, 1080, 1920);

    draw(t);
  };
  window.renderAt(0);
  function loop(now) { if (!window.__RENDER_MODE) window.renderAt((now / 1000) % 10); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
})();

<script>
function makeCodeWindow(CODE_SRC,DUR,T0,T1){
  const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
  const sm=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};
  const codeEl=document.getElementById('code'),hl=document.getElementById('hl'),fadeEl=document.getElementById('fade');
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const TOKS=[];{const re=/(\/\/.*)|('[^']*'|"[^"]*"|`[^`]*`)|\b(const|let|for|of|if|else|return|function|new|import|from|export|await|async)\b|\b(\d+\.?\d*)\b|([A-Za-z_]\w*)(?=\()|(\w+)|(\s+|.)/g;let m;
  while((m=re.exec(CODE_SRC))){const c=m[1]?'cm':m[2]?'s':m[3]?'k':m[4]?'n':m[5]?'f':m[6]?'v':'p';TOKS.push([c,m[0]])}}
  const LH=40,CTOP=68,VIS=9,N=CODE_SRC.length;
  const LS=[0];for(let i=0;i<N;i++)if(CODE_SRC[i]==='\n')LS.push(i+1);
  return function(t){
    const n=Math.floor(N*clamp((t-T0)/(T1-T0)));
    let left=n,h='';
    for(const[c,s]of TOKS){if(left<=0)break;const part=s.slice(0,left);left-=part.length;h+='<span class="'+c+'">'+esc(part)+'</span>'}
    codeEl.innerHTML=h+((n<N||Math.floor(t*2)%2===0)?'<span class="cr"></span>':'');
    let line=0;for(let k=0;k<LS.length;k++)if(LS[k]<=n)line=k;
    let sc=0;for(let k=VIS;k<LS.length;k++){const tk=T0+(T1-T0)*LS[k]/N;sc+=sm(tk,tk+.22,t)}
    codeEl.style.transform='translateY('+(-sc*LH)+'px)';
    hl.style.top=(CTOP+(line-sc)*LH)+'px';
    fadeEl.style.opacity=1-Math.min(sm(0,.35,t),sm(0,.35,DUR-t));
  };
}

(function(){
  const inner=window.renderAt,DUR=10,T0=.4,T1=7.4,HERO=5.1,HOLD=5.15;
  const cw=makeCodeWindow("const field = passwordField({ mask: true });\nfor (const ch of 'Zz9!kQ7#vL2$') {\n  field.type(ch);\n  meter.score(entropy(field.value));\n}\nmeter.label(score > 80 ? 'STRONG' : 'WEAK');\nbar.fill(score / 100, { color: '#34d399' });\nlock.close({ dur: 0.8, ease: 'back' });\nshield.glow('#34d399');\nlabel.set('ENCRYPTED · LOCKED');\nhold(lock);",DUR,T0,T1);
  const clamp=(x)=>Math.min(1,Math.max(0,x));
  window.renderAt=function(tIn){
    let T=Number(tIn)%DUR;if(T<0)T+=DUR;
    let st=clamp((T-T0)/(T1-T0))*HERO;
    if(T>T1)st=Math.min(HOLD,HERO+(T-T1)*(HOLD-HERO)/2.2);
    inner(st);cw(T);
  };
  window.renderAt(0);
  Promise.all([document.fonts.load("700 90px Oswald"),document.fonts.load("400 30px JBM")]).catch(()=>{}).then(()=>{window.renderAt(0);window.__ready=true});
})();
</script>
