<!doctype html>
<html><head><meta charset="utf-8"><title>Glossy Spheres Animation</title>
<style>
@font-face{font-family:'Oswald';font-weight:700;src:url(fonts/oswald-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'JBM';font-weight:400;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2')}
html,body{margin:0;background:#000;overflow:hidden;width:1080px;height:1920px;position:relative}
canvas{position:absolute;left:0;top:0;z-index:0}
#title{position:absolute;left:0;top:150px;width:1080px;height:180px;z-index:5;text-align:center;
 font:700 90px/92px 'Oswald',Impact,sans-serif;letter-spacing:3px;color:#fff}
#title .l2{color:#8f9bff;text-shadow:0 0 14px rgba(143,155,255,.65),0 0 40px rgba(143,155,255,.35)}
#win{position:absolute;left:40px;top:1400px;width:1000px;height:440px;box-sizing:border-box;z-index:30;
 background:#1e1e1e;border:1px solid #ffffff14;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.8)}
#bar{position:absolute;left:0;top:0;width:100%;height:56px;background:#181818;z-index:3}
.dot{position:absolute;top:20px;width:15px;height:15px;border-radius:50%}
#tab{position:absolute;left:150px;bottom:0;height:42px;padding:0 26px;background:#1e1e1e;color:#d4d4d4;
 font:400 22px/42px 'JBM',monospace;border-radius:9px 9px 0 0;border-top:2px solid #8f9bff}
#code{position:absolute;left:30px;top:68px;margin:0;font:400 30px/40px 'JBM',monospace;color:#d4d4d4;white-space:pre;z-index:2}
#hl{position:absolute;left:0;width:100%;height:40px;top:68px;z-index:1;background:linear-gradient(90deg,rgba(143,155,255,.16),rgba(143,155,255,.05));
 border-left:3px solid #8f9bff;box-shadow:0 0 18px rgba(143,155,255,.18)}
.k{color:#569cd6}.f{color:#dcdcaa}.n{color:#b5cea8}.v{color:#9cdcfe}.s{color:#ce9178}.cm{color:#6a9955}.c{color:#4fc1ff}.p{color:#d4d4d4}
.cr{display:inline-block;width:3px;height:32px;background:#8f9bff;vertical-align:-6px;margin-left:1px}
#fade{position:absolute;left:0;top:0;width:1080px;height:1920px;background:#000;z-index:99;pointer-events:none;opacity:1}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="title">Glossy Spheres<br><span class="l2">Animation</span></div>
<div id="win"><div id="bar"><i class="dot" style="left:22px;background:#ff5f56"></i><i class="dot" style="left:48px;background:#ffbd2e"></i><i class="dot" style="left:74px;background:#27c93f"></i><div id="tab">spheres.js</div></div>
<div id="hl"></div><pre id="code"></pre></div>
<div id="fade"></div>
<script>
const CODE_SRC="const balls = pile(22, SEED);\nconst floor = bottom(scene);\nworld.gravity = 2600;          // px/s^2\nfor (const b of balls) {\n  b.radius = pick([56, 84, 112]);\n  b.drop({ x: spread(b.i), delay: b.i * 0.35 });\n}\nworld.collide(balls, { bounce: 0.45 });\nworld.rest(floor);\nballs.forEach((b) => b.shade(glossy));\nlight.key.set(-0.5, -0.8, 1);\nhold(balls);";
const W=1080,H=1920,TAU=Math.PI*2,DUR=10,T0=.4,T1=7.4;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const sm=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};
const eo3=x=>1-Math.pow(1-clamp(x),3);
const eob=x=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
function rng(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function hex(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function mix(a,b,k){const A=hex(a),B=hex(b);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')+')'}
const PX0=40,PX1=1040,PY0=360,PY1=1400,FLOOR=1392;
const COLS=['#6f72f6','#8a8cf8','#a58bf2','#3fbfe6','#2a35c4','#7d5cf0','#5b6cf5','#9aa4ff'];
const RAD=[112,96,84,104,72,90,64,80,100,68,76,58,88,70,62,94,66,78,56,82,60,74];
// deterministic physics: balls fall one by one, collide, and pile up on the floor
const SIM_DT=1/240,REC=2,SIM_T=DUR+.2,G=2600;
const balls=(()=>{
  const r=rng(23),B=RAD.map((R,i)=>({r:R,at:.5+i*.28,x:PX0+R+r()*(PX1-PX0-2*R),y:PY0-R-6,vx:(r()-.5)*140,vy:0,on:false,
    col:COLS[(i*5+2)%COLS.length],chrome:i===3||i===9||i===15,tr:[]}));
  const n=B.length,steps=Math.round(SIM_T/SIM_DT);
  for(let s=0;s<=steps;s++){
    const ts=s*SIM_DT;
    for(const b of B){if(!b.on&&ts>=b.at)b.on=true;}
    const A=B.filter(b=>b.on);
    for(const b of A){b.vy+=G*SIM_DT;b.x+=b.vx*SIM_DT;b.y+=b.vy*SIM_DT}
    for(let it=0;it<6;it++){
      for(const b of A){
        if(b.y+b.r>FLOOR){b.y=FLOOR-b.r;if(b.vy>0)b.vy=b.vy>140?-b.vy*.28:0;b.vx*=.97}
        if(b.x-b.r<PX0){b.x=PX0+b.r;if(b.vx<0)b.vx=-b.vx*.2}
        if(b.x+b.r>PX1){b.x=PX1-b.r;if(b.vx>0)b.vx=-b.vx*.2}
      }
      for(let i=0;i<A.length;i++)for(let j=i+1;j<A.length;j++){
        const p=A[i],q=A[j],dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy),m=p.r+q.r;
        if(d>=m||d<1e-6)continue;
        const nx=dx/d,ny=dy/d,mp=p.r*p.r,mq=q.r*q.r,ov=m-d;
        p.x-=nx*ov*mq/(mp+mq);p.y-=ny*ov*mq/(mp+mq);q.x+=nx*ov*mp/(mp+mq);q.y+=ny*ov*mp/(mp+mq);
        const rvx=q.vx-p.vx,rvy=q.vy-p.vy,vn=rvx*nx+rvy*ny;
        if(vn<0){
          const e=vn<-160?.3:0,j2=-(1+e)*vn/(1/mp+1/mq);
          p.vx-=j2*nx/mp;p.vy-=j2*ny/mp;q.vx+=j2*nx/mq;q.vy+=j2*ny/mq;
          const tx=rvx-vn*nx,ty=rvy-vn*ny,f=.12;
          p.vx+=tx*f*mq/(mp+mq);p.vy+=ty*f*mq/(mp+mq);q.vx-=tx*f*mp/(mp+mq);q.vy-=ty*f*mp/(mp+mq);
        }
      }
    }
    for(const b of A){if(Math.hypot(b.vx,b.vy)<14){b.vx=0;b.vy=0}}
    if(s%REC===0)for(const b of B)b.tr.push(b.on?[b.x,b.y]:null);
  }
  return B;
})();
function posAt(b,t){
  const f=t/(SIM_DT*REC),i=Math.min(b.tr.length-2,Math.floor(f)),k=f-i,p=b.tr[i],q=b.tr[i+1];
  if(!p)return q&&t>=b.at-.02?q:null;
  if(!q)return p;return[p[0]+(q[0]-p[0])*k,p[1]+(q[1]-p[1])*k];
}
function ball(b,r,x,y){
  ctx.save();
  if(b.chrome){
    const g=ctx.createRadialGradient(x-r*.25,y-r*.3,r*.05,x,y,r);
    g.addColorStop(0,'#e4e7ff');g.addColorStop(.45,'#bfc4f4');g.addColorStop(.78,'#7f84e6');g.addColorStop(.93,'#4b3fd0');g.addColorStop(1,'#2a2090');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=Math.max(2,r*.035);ctx.beginPath();ctx.arc(x,y,r*.62,.3,TAU*.62);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.38)';ctx.beginPath();ctx.ellipse(x-r*.42,y-r*.5,r*.2,r*.1,-.7,0,TAU);ctx.fill();
  }else{
    const g=ctx.createRadialGradient(x-r*.35,y-r*.42,r*.04,x,y,r*1.02);
    g.addColorStop(0,mix(b.col,'#ffffff',.26));g.addColorStop(.5,b.col);g.addColorStop(1,mix(b.col,'#0a0a50',.5));
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.beginPath();ctx.ellipse(x-r*.4,y-r*.5,r*.22,r*.1,-.7,0,TAU);ctx.fill();
  }
  ctx.restore();
}
function draw(t){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.beginPath();ctx.roundRect(PX0,PY0,PX1-PX0,PY1-PY0,48);ctx.clip();
  const bg=ctx.createLinearGradient(0,PY0,0,PY1);bg.addColorStop(0,'#1d1f8f');bg.addColorStop(1,'#0c0d52');ctx.fillStyle=bg;ctx.fillRect(PX0,PY0,PX1-PX0,PY1-PY0);
  for(const b of balls){
    const p=posAt(b,t);if(!p)continue;
    ctx.fillStyle='rgba(0,0,30,.28)';ctx.beginPath();ctx.ellipse(p[0]+b.r*.12,p[1]+b.r*.12,b.r,b.r,0,0,TAU);ctx.fill();
    ball(b,b.r,p[0],p[1]);
  }
  ctx.restore();
  ctx.strokeStyle='rgba(160,170,255,.35)';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(PX0,PY0,PX1-PX0,PY1-PY0,48);ctx.stroke();
}

// ---- code window ----
function makeCodeWindow(CODE_SRC,DUR,T0,T1){
  const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
  const sm=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};
  const codeEl=document.getElementById('code'),hl=document.getElementById('hl'),fadeEl=document.getElementById('fade');
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const TOKS=[];{const re=/(\/\/.*)|('[^']*'|"[^"]*"|`[^`]*`)|\b(const|let|for|of|if|else|return|function|new|import|from|export|await|async)\b|\b(\d+\.?\d*)\b|([A-Za-z_]\w*)(?=\()|(\w+)|(\s+|.)/g;let m;
  while((m=re.exec(CODE_SRC))){const c=m[1]?'cm':m[2]?'s':m[3]?'k':m[4]?'n':m[5]?'f':m[6]?'v':'p';TOKS.push([c,m[0]])}}
  const LH=40,CTOP=68,VIS=9,N=CODE_SRC.length;
  const LS=[0];for(let i=0;i<N;i++)if(CODE_SRC[i]==='\n')LS.push(i+1);
  return function(t){
    const n=Math.floor(N*clamp((t-T0)/(T1-T0)));
    let left=n,h='';
    for(const[c,s]of TOKS){if(left<=0)break;const part=s.slice(0,left);left-=part.length;h+='<span class="'+c+'">'+esc(part)+'</span>'}
    codeEl.innerHTML=h+((n<N||Math.floor(t*2)%2===0)?'<span class="cr"></span>':'');
    let line=0;for(let k=0;k<LS.length;k++)if(LS[k]<=n)line=k;
    let sc=0;for(let k=VIS;k<LS.length;k++){const tk=T0+(T1-T0)*LS[k]/N;sc+=sm(tk,tk+.22,t)}
    codeEl.style.transform='translateY('+(-sc*LH)+'px)';
    hl.style.top=(CTOP+(line-sc)*LH)+'px';
    fadeEl.style.opacity=1-Math.min(sm(0,.35,t),sm(0,.35,DUR-t));
  };
}

const __cw=makeCodeWindow(CODE_SRC,DUR,T0,T1);
window.renderAt=function(tIn){
  let t=Number(tIn)%DUR;if(t<0)t+=DUR;
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.shadowBlur=0;
  draw(t);__cw(t);
};
window.renderAt(0);
Promise.all([document.fonts.load("700 90px Oswald"),document.fonts.load("400 30px JBM")]).catch(()=>{}).then(()=>{window.renderAt(0);window.__ready=true});
(function loop(now){if(!window.__RENDER_MODE)window.renderAt((now/1000)%DUR);requestAnimationFrame(loop)})(0);

</script></body></html>
