<!doctype html>
<html><head><meta charset="utf-8"><title>Glossy Spheres Animation</title>
<style>
@font-face{font-family:'Oswald';font-weight:700;src:url(fonts/oswald-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'JBM';font-weight:400;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2')}
html,body{margin:0;background:#000;overflow:hidden;width:1080px;height:1920px;position:relative}
canvas{position:absolute;left:0;top:0;z-index:0}
#title{position:absolute;left:0;top:150px;width:1080px;height:180px;z-index:5;text-align:center;
 font:700 90px/92px 'Oswald',Impact,sans-serif;letter-spacing:3px;color:#fff}
#title .l2{color:#8f9bff;text-shadow:0 0 14px rgba(143,155,255,.65),0 0 40px rgba(143,155,255,.35)}
#win{position:absolute;left:60px;top:1430px;width:960px;height:340px;box-sizing:border-box;z-index:5;
 background:#1e1e1e;border:1px solid #ffffff14;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.8)}
#bar{height:44px;background:#181818;display:flex;align-items:flex-end;position:relative}
.dot{position:absolute;top:15px;width:13px;height:13px;border-radius:50%}
#tab{margin-left:130px;height:34px;line-height:34px;padding:0 22px;background:#1e1e1e;color:#d4d4d4;
 font:400 18px/34px 'JBM',monospace;border-radius:8px 8px 0 0;border-top:2px solid #8f9bff}
#code{position:absolute;left:28px;top:56px;margin:0;font:400 23.5px/31px 'JBM',monospace;color:#d4d4d4;white-space:pre}
#hl{position:absolute;left:0;width:100%;height:31px;top:56px;background:linear-gradient(90deg,rgba(143,155,255,.16),rgba(143,155,255,.05));
 border-left:3px solid #8f9bff;box-shadow:0 0 18px rgba(143,155,255,.18)}
.k{color:#569cd6}.f{color:#dcdcaa}.n{color:#b5cea8}.v{color:#9cdcfe}.s{color:#ce9178}.cm{color:#6a9955}.p{color:#d4d4d4}
.cr{display:inline-block;width:2px;height:24px;background:#8f9bff;vertical-align:-4px;margin-left:1px}
#fade{position:absolute;left:0;top:0;width:1080px;height:1920px;background:#000;z-index:9;pointer-events:none;opacity:1}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="title">Glossy Spheres<br><span class="l2">Animation</span></div>
<div id="win"><div id="bar"><i class="dot" style="left:20px;background:#ff5f56"></i><i class="dot" style="left:44px;background:#ffbd2e"></i><i class="dot" style="left:68px;background:#27c93f"></i><div id="tab">spheres.js</div></div>
<div id="hl"></div><pre id="code"></pre></div>
<div id="fade"></div>
<script>
const CODE_SRC="const balls = pile(16, SEED);   // pack on the floor\nfor (const b of balls) {\n  const k = (t - b.at) / 0.7;\n  b.y = b.y1 - 900 * (1 - bounce(k));   // fall\n  b.r = b.r1 * popBack(k);              // pop in\n}\nconst breathe = 1 + 0.03 * sin(t * 2.5);\nballs.forEach((b) => draw(b, breathe));";
const W=1080,H=1920,TAU=Math.PI*2,DUR=10,T0=.4,T1=7.4;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const sm=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};
const eo3=x=>1-Math.pow(1-clamp(x),3);
const eob=x=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
function rng(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function hex(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function mix(a,b,k){const A=hex(a),B=hex(b);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')+')'}
const PX0=40,PX1=1040,PY0=360,PY1=1400,FLOOR=1380;
const COLS=['#6f72f6','#8a8cf8','#a58bf2','#3fbfe6','#2a35c4','#7d5cf0','#5b6cf5','#9aa4ff'];
const RAD=[190,160,140,125,115,105,98,90,84,76,70,64,58,52,46,40];
function packWith(sc){
  const r=rng(11),placed=[];
  for(const base of RAD){const R=base*sc;let best=null;
    for(let x=PX0+R+4;x<=PX1-R-4;x+=5){let y=FLOOR-R;
      for(const q of placed){const dx=x-q.x,d=R+q.r;if(Math.abs(dx)<d)y=Math.min(y,q.y-Math.sqrt(d*d-dx*dx))}
      const sc2=y+(r()-.5)*14;if(!best||sc2>best.s)best={x,y,s:sc2}}
    placed.push({x:best.x,y:best.y,r:R})}
  return placed;
}
let balls;{let lo=.5,hi=1.8,res=null;for(let i=0;i<12;i++){const m=(lo+hi)/2,p=packWith(m);const top=Math.min(...p.map(b=>b.y-b.r));if(top<PY0+60)hi=m;else{lo=m;res=p}}
  balls=(res||packWith(lo)).map((b,i)=>({x:b.x,y1:b.y,r1:b.r,at:.5+i*.42,col:COLS[(i*5+2)%COLS.length],chrome:i===4||i===9||i===13,ph:i*1.7}))}
function bounce(k){k=clamp(k);const n1=7.5625,d1=2.75;if(k<1/d1)return n1*k*k;if(k<2/d1){k-=1.5/d1;return n1*k*k+.75}if(k<2.5/d1){k-=2.25/d1;return n1*k*k+.9375}k-=2.625/d1;return n1*k*k+.984375}
function ball(b,r,y,breathe){
  const x=b.x;ctx.save();
  if(b.chrome){
    const g=ctx.createRadialGradient(x-r*.2,y-r*.25,r*.05,x,y,r);
    g.addColorStop(0,'#ffffff');g.addColorStop(.45,'#dfe2ff');g.addColorStop(.78,'#9296ff');g.addColorStop(.93,'#4b3fd0');g.addColorStop(1,'#2a2090');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=Math.max(2,r*.04);ctx.beginPath();ctx.arc(x,y,r*.62,.3,TAU*.62);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.ellipse(x-r*.42,y-r*.5,r*.2,r*.1,-.7,0,TAU);ctx.fill();
  }else{
    const g=ctx.createRadialGradient(x-r*.35,y-r*.42,r*.04,x,y,r*1.02);
    g.addColorStop(0,mix(b.col,'#ffffff',.42));g.addColorStop(.5,b.col);g.addColorStop(1,mix(b.col,'#0a0a50',.45));
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.28)';ctx.beginPath();ctx.ellipse(x-r*.4,y-r*.5,r*.22,r*.1,-.7,0,TAU);ctx.fill();
  }
  ctx.restore();
}
function draw(t){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.beginPath();ctx.roundRect(PX0,PY0,PX1-PX0,PY1-PY0,48);ctx.clip();
  const bg=ctx.createLinearGradient(0,PY0,0,PY1);bg.addColorStop(0,'#1d1f8f');bg.addColorStop(1,'#0c0d52');ctx.fillStyle=bg;ctx.fillRect(PX0,PY0,PX1-PX0,PY1-PY0);
  const amp=sm(7,8,t);
  for(const b of balls){
    const k=(t-b.at)/.75;if(k<=0)continue;
    const r=b.r1*Math.max(.01,eob(k*1.8))*(1+.03*amp*Math.sin(TAU*(t/2.5)+b.ph)),y=b.y1-(1-bounce(k))*(b.y1-PY0+b.r1*2+40);
    ball(b,r,y);
  }
  ctx.restore();
  ctx.strokeStyle='rgba(160,170,255,.35)';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(PX0,PY0,PX1-PX0,PY1-PY0,48);ctx.stroke();
}

// ---- code window ----
const codeEl=document.getElementById('code'),hl=document.getElementById('hl'),fadeEl=document.getElementById('fade');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const TOKS=[];{const re=/(\/\/.*)|('[^']*'|"[^"]*")|\b(const|let|for|of|if|return|function|new)\b|\b(\d+\.?\d*)\b|([A-Za-z_]\w*)(?=\()|(\w+)|(\s+|.)/g;let m;
while((m=re.exec(CODE_SRC))){const c=m[1]?'cm':m[2]?'s':m[3]?'k':m[4]?'n':m[5]?'f':m[6]?'v':'p';TOKS.push([c,m[0]])}}
let lastN=-1;
function setCode(t){
  const N=CODE_SRC.length,n=Math.floor(N*clamp((t-T0)/(T1-T0)));
  const key=n+(Math.floor(t*2)%2?'a':'b');if(key===lastN)return;lastN=key;
  let left=n,h='';
  for(const[c,s]of TOKS){if(left<=0)break;const part=s.slice(0,left);left-=part.length;h+='<span class="'+c+'">'+esc(part)+'</span>'}
  const caret=(n<N||Math.floor(t*2)%2===0)?'<span class="cr"></span>':'';
  codeEl.innerHTML=h+caret;
  const line=(CODE_SRC.slice(0,n).match(/\n/g)||[]).length;
  hl.style.top=(56+31*line)+'px';
}
window.renderAt=function(tIn){
  let t=Number(tIn)%DUR;if(t<0)t+=DUR;
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.shadowBlur=0;
  draw(t);setCode(t);
  fadeEl.style.opacity=1-Math.min(sm(0,.35,t),sm(0,.35,DUR-t));
};
window.renderAt(0);
Promise.all([document.fonts.load("700 90px Oswald"),document.fonts.load("400 23px JBM")]).catch(()=>{}).then(()=>{window.renderAt(0);window.__ready=true});
(function loop(now){if(!window.__RENDER_MODE)window.renderAt((now/1000)%DUR);requestAnimationFrame(loop)})(0);

</script></body></html>
