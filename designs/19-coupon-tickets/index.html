<!doctype html>
<html><head><meta charset="utf-8"><title>Coupon Tickets Animation</title>
<style>
@font-face{font-family:'Oswald';font-weight:700;src:url(fonts/oswald-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'JBM';font-weight:400;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2')}
html,body{margin:0;background:#000;overflow:hidden;width:1080px;height:1920px;position:relative}
canvas{position:absolute;left:0;top:0;z-index:0}
#title{position:absolute;left:0;top:150px;width:1080px;height:180px;z-index:5;text-align:center;
 font:700 90px/92px 'Oswald',Impact,sans-serif;letter-spacing:3px;color:#fff}
#title .l2{color:#7fe3d0;text-shadow:0 0 14px rgba(127,227,208,.65),0 0 40px rgba(127,227,208,.35)}
#win{position:absolute;left:40px;top:1400px;width:1000px;height:440px;box-sizing:border-box;z-index:30;
 background:#1e1e1e;border:1px solid #ffffff14;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.8)}
#bar{position:absolute;left:0;top:0;width:100%;height:56px;background:#181818;z-index:3}
.dot{position:absolute;top:20px;width:15px;height:15px;border-radius:50%}
#tab{position:absolute;left:150px;bottom:0;height:42px;padding:0 26px;background:#1e1e1e;color:#d4d4d4;
 font:400 22px/42px 'JBM',monospace;border-radius:9px 9px 0 0;border-top:2px solid #7fe3d0}
#code{position:absolute;left:30px;top:68px;margin:0;font:400 30px/40px 'JBM',monospace;color:#d4d4d4;white-space:pre;z-index:2}
#hl{position:absolute;left:0;width:100%;height:40px;top:68px;z-index:1;background:linear-gradient(90deg,rgba(127,227,208,.16),rgba(127,227,208,.05));
 border-left:3px solid #7fe3d0;box-shadow:0 0 18px rgba(127,227,208,.18)}
.k{color:#569cd6}.f{color:#dcdcaa}.n{color:#b5cea8}.v{color:#9cdcfe}.s{color:#ce9178}.cm{color:#6a9955}.c{color:#4fc1ff}.p{color:#d4d4d4}
.cr{display:inline-block;width:3px;height:32px;background:#7fe3d0;vertical-align:-6px;margin-left:1px}
#fade{position:absolute;left:0;top:0;width:1080px;height:1920px;background:#000;z-index:99;pointer-events:none;opacity:1}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="title">Coupon Tickets<br><span class="l2">Animation</span></div>
<div id="win"><div id="bar"><i class="dot" style="left:22px;background:#ff5f56"></i><i class="dot" style="left:48px;background:#ffbd2e"></i><i class="dot" style="left:74px;background:#27c93f"></i><div id="tab">tickets.js</div></div>
<div id="hl"></div><pre id="code"></pre></div>
<div id="fade"></div>
<script>
const CODE_SRC="const tickets = [32, 12, 25, 7, 50].map(ticket);\ntickets.forEach((k, i) => {\n  k.angle = (i - 2) * 11;\n  k.fanIn(0.25 * i);\n});\nconst pick = tickets.find((k) => k.off === 25);\npick.liftForward({ z: 1, dur: 0.8 });\npick.tearAlong(pick.perforation);\nscanner.sweep(pick.barcode, { dur: 1.2 });\nbadge.show('25% OFF', { glow: '#7fe3d0' });\nhold(pick);";
const W=1080,H=1920,TAU=Math.PI*2,DUR=10,T0=.4,T1=7.4;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const sm=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};
const eo3=x=>1-Math.pow(1-clamp(x),3);
const eob=x=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
function rng(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function hex(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function mix(a,b,k){const A=hex(a),B=hex(b);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')+')'}
const L=600,TH=210,PX=225,PY=880,TIPS=[{p:32,c:['#c08ae0','#cfc2ff','#8fc2fb']},{p:12,c:['#ffc27a','#ffb39a','#ff8aa0']},{p:25,c:['#8ec5fb','#5fb0f4','#5bf0c8']},{p:7,c:['#b9e89a','#96f0b0','#8fd8f0']},{p:50,c:['#f08ad0','#f0a0c8','#ff9a8a']}];
const bars=[];{const r=rng(5);let x=0;while(x<150){const w=1+Math.floor(r()*4);bars.push([x,w]);x+=w+1+Math.floor(r()*3)}}
function tpath(){ctx.beginPath();const r=22,n=24;ctx.moveTo(r,0);ctx.lineTo(L-r,0);ctx.arcTo(L,0,L,r,r);ctx.lineTo(L,TH/2-n);ctx.arc(L,TH/2,n,-Math.PI/2,Math.PI/2,true);ctx.lineTo(L,TH-r);ctx.arcTo(L,TH,L-r,TH,r);ctx.lineTo(r,TH);ctx.arcTo(0,TH,0,TH-r,r);ctx.lineTo(0,TH/2+n);ctx.arc(0,TH/2,n,Math.PI/2,-Math.PI/2,true);ctx.lineTo(0,r);ctx.arcTo(0,0,r,0,r);ctx.closePath()}
function jag(side){ctx.beginPath();const ys=[];for(let y=-20;y<=TH+20;y+=14)ys.push(y);
  ctx.moveTo(side<0?-40:L+40,-20);ys.forEach((y,i)=>ctx.lineTo(140+((i%2)?7:-7),y));ctx.lineTo(side<0?-40:L+40,TH+20);ctx.closePath()}
function icons(){
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.roundRect(380,38,170,10,5);ctx.fill();ctx.beginPath();ctx.roundRect(380,60,130,10,5);ctx.fill();ctx.beginPath();ctx.roundRect(380,82,150,10,5);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.4)';ctx.beginPath();ctx.roundRect(385,148,80,36,18);ctx.fill();ctx.beginPath();ctx.roundRect(480,148,80,36,18);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=3.5;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.ellipse(425,166,15,9,0,0,TAU);ctx.stroke();ctx.beginPath();ctx.arc(425,166,4,0,TAU);ctx.stroke();
  ctx.beginPath();ctx.moveTo(510,167);ctx.lineTo(518,175);ctx.lineTo(532,158);ctx.stroke();
}
function part(tk,which,t){
  ctx.save();tpath();ctx.clip();
  if(which==='stub'){jag(-1);ctx.clip()}else if(which==='main'){jag(1);ctx.clip()}
  const g=ctx.createLinearGradient(0,0,L,0);g.addColorStop(0,tk.c[1]);g.addColorStop(1,tk.c[2]);ctx.fillStyle=g;ctx.fillRect(-10,-10,L+20,TH+20);
  const sg=ctx.createLinearGradient(0,0,0,TH);sg.addColorStop(0,tk.c[0]);sg.addColorStop(1,mix(tk.c[0],'#ffffff',.25));ctx.fillStyle=sg;ctx.fillRect(-10,-10,150,TH+20);
  ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=3;ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(140,0);ctx.lineTo(140,TH);ctx.stroke();ctx.setLineDash([]);
  ctx.save();ctx.translate(76,TH/2);ctx.rotate(-Math.PI/2);ctx.fillStyle='#fff';ctx.font="700 34px Oswald, sans-serif";ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('DISCOUNT',0,0);ctx.restore();
  ctx.fillStyle='#fff';ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.font="700 108px Oswald, sans-serif";ctx.save();ctx.shadowColor='rgba(0,0,0,.18)';ctx.shadowBlur=10;ctx.shadowOffsetY=4;ctx.fillText(tk.p+'%',170,110);ctx.restore();
  ctx.fillStyle='#262a46';bars.forEach(([x,w])=>ctx.fillRect(175+x,128,w,52));
  ctx.fillStyle='#262a46';ctx.font="400 13px JBM, monospace";ctx.fillText('1234567890',200,196);
  icons();
  if(tk.scan!=null){const sx=tk.scan;
    ctx.save();ctx.beginPath();ctx.rect(175,120,Math.max(0,sx-175),70);ctx.clip();ctx.fillStyle='#10d884';bars.forEach(([x,w])=>ctx.fillRect(175+x,128,w,52));ctx.restore();
    if(sx<=330&&sx>=175){ctx.save();ctx.shadowColor='#25ff9c';ctx.shadowBlur=24;ctx.fillStyle='#25ff9c';ctx.fillRect(sx-2,112,4,86);ctx.restore()}
    if(tk.ok>0){ctx.save();const s=eob(tk.ok);ctx.translate(352,154);ctx.scale(s,s);ctx.fillStyle='#14c878';ctx.beginPath();ctx.arc(0,0,20,0,TAU);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-9,0);ctx.lineTo(-3,7);ctx.lineTo(10,-8);ctx.stroke();ctx.restore()}}
  if(which!=='full'){ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=4;jag(which==='stub'?-1:1);ctx.stroke()}
  ctx.restore();
}
function drawTicket(tk,i,t,lift,tear){
  const sc=lerp(1,1.25,lift),px=lerp(PX,540-L*1.25/2,lift),py=lerp(PY,PY+10,lift);
  const ang=tk.angle;
  ctx.save();ctx.translate(px,py);ctx.rotate(ang);ctx.scale(sc,sc);ctx.translate(0,-TH/2);
  ctx.shadowColor='rgba(60,70,140,.35)';ctx.shadowBlur=28;ctx.shadowOffsetY=12;
  if(tear<=0){part(tk,'full',t)}
  else{
    ctx.save();ctx.translate(140,TH/2);ctx.rotate(-.3*tear);ctx.translate(-140-50*tear,-TH/2+42*tear);part(tk,'stub',t);ctx.restore();
    ctx.save();ctx.translate(24*tear,-12*tear);part(tk,'main',t);ctx.restore();
  }
  ctx.restore();
}
function draw(t){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,360,0,1400);bg.addColorStop(0,'#eef0f8');bg.addColorStop(1,'#dde2f2');ctx.fillStyle=bg;ctx.beginPath();ctx.roundRect(40,360,1000,1040,44);ctx.fill();
  ctx.save();ctx.beginPath();ctx.roundRect(40,360,1000,1040,44);ctx.clip();ctx.strokeStyle='rgba(180,170,240,.2)';ctx.lineWidth=60;ctx.beginPath();ctx.arc(1000,420,360,0,TAU);ctx.stroke();ctx.beginPath();ctx.arc(80,1380,300,0,TAU);ctx.stroke();
  const order=[0,1,3,4,2];
  const lift=eo3((t-4.6)/.8),tear=eo3((t-5.7)/.9);
  TIPS.forEach((tk,i)=>{tk.angle=0;const f=(t-(.5+.65*i))/.9;tk.f=f;tk.angle=(i-2)*20*Math.PI/180*eob(f);tk.scan=null;tk.ok=0});
  const pick=TIPS[2];pick.scan=t>6.8?lerp(160,345,sm(6.8,8.0,t)):null;if(t<6.8)pick.scan=null;pick.ok=clamp((t-8.1)/.4);
  order.forEach(i=>{const tk=TIPS[i];if(tk.f<=0)return;
    if(i===2){ctx.fillStyle='rgba(238,240,250,'+(.35*sm(4.6,5.4,t))+')';ctx.fillRect(40,360,1000,1040)}
    ctx.globalAlpha=clamp(tk.f*4)*(i===2?1:1-.62*lift);drawTicket(tk,i,t,i===2?lift:0,i===2?tear:0);ctx.globalAlpha=1});
  ctx.restore();
}

// ---- code window ----
function makeCodeWindow(CODE_SRC,DUR,T0,T1){
  const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
  const sm=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};
  const codeEl=document.getElementById('code'),hl=document.getElementById('hl'),fadeEl=document.getElementById('fade');
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const TOKS=[];{const re=/(\/\/.*)|('[^']*'|"[^"]*"|`[^`]*`)|\b(const|let|for|of|if|else|return|function|new|import|from|export|await|async)\b|\b(\d+\.?\d*)\b|([A-Za-z_]\w*)(?=\()|(\w+)|(\s+|.)/g;let m;
  while((m=re.exec(CODE_SRC))){const c=m[1]?'cm':m[2]?'s':m[3]?'k':m[4]?'n':m[5]?'f':m[6]?'v':'p';TOKS.push([c,m[0]])}}
  const LH=40,CTOP=68,VIS=9,N=CODE_SRC.length;
  const LS=[0];for(let i=0;i<N;i++)if(CODE_SRC[i]==='\n')LS.push(i+1);
  return function(t){
    const n=Math.floor(N*clamp((t-T0)/(T1-T0)));
    let left=n,h='';
    for(const[c,s]of TOKS){if(left<=0)break;const part=s.slice(0,left);left-=part.length;h+='<span class="'+c+'">'+esc(part)+'</span>'}
    codeEl.innerHTML=h+((n<N||Math.floor(t*2)%2===0)?'<span class="cr"></span>':'');
    let line=0;for(let k=0;k<LS.length;k++)if(LS[k]<=n)line=k;
    let sc=0;for(let k=VIS;k<LS.length;k++){const tk=T0+(T1-T0)*LS[k]/N;sc+=sm(tk,tk+.22,t)}
    codeEl.style.transform='translateY('+(-sc*LH)+'px)';
    hl.style.top=(CTOP+(line-sc)*LH)+'px';
    fadeEl.style.opacity=1-Math.min(sm(0,.35,t),sm(0,.35,DUR-t));
  };
}

const __cw=makeCodeWindow(CODE_SRC,DUR,T0,T1);
window.renderAt=function(tIn){
  let t=Number(tIn)%DUR;if(t<0)t+=DUR;
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.shadowBlur=0;
  draw(t);__cw(t);
};
window.renderAt(0);
Promise.all([document.fonts.load("700 90px Oswald"),document.fonts.load("400 30px JBM")]).catch(()=>{}).then(()=>{window.renderAt(0);window.__ready=true});
(function loop(now){if(!window.__RENDER_MODE)window.renderAt((now/1000)%DUR);requestAnimationFrame(loop)})(0);

</script></body></html>
