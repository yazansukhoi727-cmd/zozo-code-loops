<!DOCTYPE html>
<html lang="en">
<head>

@font-face{font-family:'JBM';font-weight:400;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2')}

    * {

      margin: 0;
      padding: 0;
    }

      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

      height: 1920px;

      overflow: hidden;
      transform-origin: center center;
      box-shadow: 0 0 80px rgba(168, 230, 255, 0.08);

      top: 150px;
      left: 0;
      width: 1080px;
      height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 20;
      pointer-events: none;
    }

      letter-spacing: 3px;
      color: #fff;
    }

    .title-line-2 {

      font-weight: 800;
      font-size: 86px;

      text-transform: uppercase;
      color: #a8e6ff;
      text-shadow:

        0 0 42px rgba(168, 230, 255, 0.45),
        0 0 80px rgba(196, 181, 253, 0.25);
      transform: scaleY(1.08);
      margin-top: 6px;
    }

    /* MAIN STAGE CANVAS: covers full 1080x1920 */
    #stage-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      z-index: 10;
      pointer-events: none;
    }

    
#win{position:absolute;left:40px;top:1400px;width:1000px;height:440px;box-sizing:border-box;z-index:30;
 background:#1e1e1e;border:1px solid #ffffff14;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.8)}
#bar{position:absolute;left:0;top:0;width:100%;height:56px;background:#181818;z-index:3}
.dot{position:absolute;top:20px;width:15px;height:15px;border-radius:50%}
#tab{position:absolute;left:150px;bottom:0;height:42px;padding:0 26px;background:#1e1e1e;color:#d4d4d4;
 font:400 22px/42px 'JBM',monospace;border-radius:9px 9px 0 0;border-top:2px solid #a8e6ff}
#code{position:absolute;left:30px;top:68px;margin:0;font:400 30px/40px 'JBM',monospace;color:#d4d4d4;white-space:pre;z-index:2}
#hl{position:absolute;left:0;width:100%;height:40px;top:68px;z-index:1;background:linear-gradient(90deg,rgba(168,230,255,.16),rgba(168,230,255,.05));

.k{color:#569cd6}.f{color:#dcdcaa}.n{color:#b5cea8}.v{color:#9cdcfe}.s{color:#ce9178}.cm{color:#6a9955}.c{color:#4fc1ff}.p{color:#d4d4d4}

<div id="hl"></div><pre id="code"></pre></div>
<div id="fade"></div>
  </div>

    let t = Number(tin) % T; if (t < 0) t += T;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
    ctx.clearRect(0, 0, 1080, 1920);
    ribbons(t);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
    draw(t);
  };
  window.renderAt(0);
  function loop(now) { if (!window.__RENDER_MODE) window.renderAt((now / 1000) % 10); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
})();

<script>
function makeCodeWindow(CODE_SRC,DUR,T0,T1){
  const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
  const sm=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};
  const codeEl=document.getElementById('code'),hl=document.getElementById('hl'),fadeEl=document.getElementById('fade');
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const TOKS=[];{const re=/(\/\/.*)|('[^']*'|"[^"]*"|`[^`]*`)|\b(const|let|for|of|if|else|return|function|new|import|from|export|await|async)\b|\b(\d+\.?\d*)\b|([A-Za-z_]\w*)(?=\()|(\w+)|(\s+|.)/g;let m;
  while((m=re.exec(CODE_SRC))){const c=m[1]?'cm':m[2]?'s':m[3]?'k':m[4]?'n':m[5]?'f':m[6]?'v':'p';TOKS.push([c,m[0]])}}
  const LH=40,CTOP=68,VIS=9,N=CODE_SRC.length;
  const LS=[0];for(let i=0;i<N;i++)if(CODE_SRC[i]==='\n')LS.push(i+1);
  return function(t){
    const n=Math.floor(N*clamp((t-T0)/(T1-T0)));
    let left=n,h='';
    for(const[c,s]of TOKS){if(left<=0)break;const part=s.slice(0,left);left-=part.length;h+='<span class="'+c+'">'+esc(part)+'</span>'}
    codeEl.innerHTML=h+((n<N||Math.floor(t*2)%2===0)?'<span class="cr"></span>':'');
    let line=0;for(let k=0;k<LS.length;k++)if(LS[k]<=n)line=k;
    let sc=0;for(let k=VIS;k<LS.length;k++){const tk=T0+(T1-T0)*LS[k]/N;sc+=sm(tk,tk+.22,t)}
    codeEl.style.transform='translateY('+(-sc*LH)+'px)';
    hl.style.top=(CTOP+(line-sc)*LH)+'px';
    fadeEl.style.opacity=1-Math.min(sm(0,.35,t),sm(0,.35,DUR-t));
  };
}

(function(){
  const inner=window.renderAt,DUR=10,T0=.4,T1=7.4,HERO=4.5,HOLD=5.8;
  const cw=makeCodeWindow("const room = loadScene('lofi-room');\nconst glass = window(room, { w: 260 });\nrain.fall(glass, { drops: 90, wind: 0.2 });\ndrops.forEach((d) => d.slide(t * d.speed));\nlamp.glow({ color: '#ffb347', r: 340 });\ndesk.light(lamp, 0.8);\npetals.drift(room.plant, { n: 12 });\nmug.steam({ rise: 60, sway: 14 });\ncity.blink(stars, t);\nhold(room);",DUR,T0,T1);
  const clamp=(x)=>Math.min(1,Math.max(0,x));
  window.renderAt=function(tIn){
    let T=Number(tIn)%DUR;if(T<0)T+=DUR;
    let st=clamp((T-T0)/(T1-T0))*HERO;
    if(T>T1)st=Math.min(HOLD,HERO+(T-T1)*(HOLD-HERO)/2.2);
    inner(st);cw(T);
  };
  window.renderAt(0);
  Promise.all([document.fonts.load("700 90px Oswald"),document.fonts.load("400 30px JBM")]).catch(()=>{}).then(()=>{window.renderAt(0);window.__ready=true});
})();
</script>
