<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aizawa Attractor — Dev Reel</title>
  <style>
@font-face{font-family:'Oswald';font-weight:700;src:url(fonts/oswald-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'JBM';font-weight:400;src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2')}

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    #viewport {
      width: 1080px;
      height: 1920px;
      position: relative;
      background: #000000;
      overflow: hidden;
      transform-origin: center center;
      box-shadow: 0 0 80px rgba(168, 230, 255, 0.08);
    }

    /* TOP TITLE: y = 150..330 */
    .header-title {
      position: absolute;
      top: 150px;
      left: 0;
      width: 1080px;
      height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 20;
      pointer-events: none;
    }

    .title-line-1 {
      font: 700 90px/92px 'Oswald', Impact, sans-serif;
      letter-spacing: 3px;
      color: #fff;
    }

    .title-line-2 {
      font-family: 'Oswald', 'Bebas Neue', Impact, 'Arial Narrow', sans-serif;
      font-weight: 800;
      font-size: 86px;
      line-height: 1.02;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #a8e6ff;
      text-shadow:
        0 0 18px rgba(168, 230, 255, 0.75),
        0 0 42px rgba(168, 230, 255, 0.45),
        0 0 80px rgba(196, 181, 253, 0.25);
      transform: scaleY(1.08);
      margin-top: 6px;
    }

    /* MAIN STAGE CANVAS: covers full 1080x1920 */
    #stage-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      z-index: 10;
      pointer-events: none;
    }

    
#win{position:absolute;left:40px;top:1400px;width:1000px;height:440px;box-sizing:border-box;z-index:30;
 background:#1e1e1e;border:1px solid #ffffff14;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.8)}
#bar{position:absolute;left:0;top:0;width:100%;height:56px;background:#181818;z-index:3}
.dot{position:absolute;top:20px;width:15px;height:15px;border-radius:50%}
#tab{position:absolute;left:150px;bottom:0;height:42px;padding:0 26px;background:#1e1e1e;color:#d4d4d4;
 font:400 22px/42px 'JBM',monospace;border-radius:9px 9px 0 0;border-top:2px solid #a8e6ff}
#code{position:absolute;left:30px;top:68px;margin:0;font:400 30px/40px 'JBM',monospace;color:#d4d4d4;white-space:pre;z-index:2}
#hl{position:absolute;left:0;width:100%;height:40px;top:68px;z-index:1;background:linear-gradient(90deg,rgba(168,230,255,.16),rgba(168,230,255,.05));
 border-left:3px solid #a8e6ff;box-shadow:0 0 18px rgba(168,230,255,.18)}
.k{color:#569cd6}.f{color:#dcdcaa}.n{color:#b5cea8}.v{color:#9cdcfe}.s{color:#ce9178}.cm{color:#6a9955}.c{color:#4fc1ff}.p{color:#d4d4d4}
.cr{display:inline-block;width:3px;height:32px;background:#a8e6ff;vertical-align:-6px;margin-left:1px}
#fade{position:absolute;left:0;top:0;width:1080px;height:1920px;background:#000;z-index:99;pointer-events:none;opacity:1}
  </style>
</head>
<body>
  <div id="viewport">
    <!-- Top Title (y=150..330) -->
    <header class="header-title" id="header-title">
      <div class="title-line-1">Aizawa Attractor</div>
      <div class="title-line-2">Animation</div>
    </header>

    <!-- Middle Stage & Effects Canvas -->
    <canvas id="stage-canvas" width="1080" height="1920"></canvas>

    <!-- Bottom macOS Code Editor Card (y=1430..1770) -->
    <div id="win"><div id="bar"><i class="dot" style="left:22px;background:#ff5f56"></i><i class="dot" style="left:48px;background:#ffbd2e"></i><i class="dot" style="left:74px;background:#27c93f"></i><div id="tab">aizawa.js</div></div>
<div id="hl"></div><pre id="code"></pre></div>
<div id="fade"></div>
  </div>

  <script>
(function () {
  const TAU = Math.PI * 2, T = 6;
  const viewport = document.getElementById('viewport');
  function fitViewport() { const s = Math.min(window.innerWidth / 1080, window.innerHeight / 1920); viewport.style.transform = `scale(${s})`; }
  window.addEventListener('resize', fitViewport); fitViewport();
  const ctx = document.getElementById('stage-canvas').getContext('2d');
  const hl = document.getElementById('code-highlight'), badge = document.getElementById('phase-badge');
  const lineEls = document.querySelectorAll('.code-line');
  const CX = 540, CY = 880;
  const FONT = '"Oswald","Bebas Neue",Impact,"Arial Narrow",sans-serif';
  const MONO = '"SFMono-Regular","JetBrains Mono","Fira Code",Consolas,monospace';
  const SANS = '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
  const eo = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
  const eio = x => { const c = clamp(x, 0, 1); return c < 0.5 ? 4 * c * c * c : 1 - Math.pow(-2 * c + 2, 3) / 2; };
  const eob = x => { const c = clamp(x, 0, 1), c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(c - 1, 3) + c1 * Math.pow(c - 1, 2); };
  const sstep = (a, b, x) => { const c = clamp((x - a) / (b - a), 0, 1); return c * c * (3 - 2 * c); };
  const fract = x => x - Math.floor(x);
  function prng(seed) { let a = seed >>> 0; return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function rr(c, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  function star(x, y, r, color, alpha, rot) {
    if (alpha <= 0.005 || r <= 0.2) return;
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha = clamp(alpha, 0, 1); ctx.fillStyle = color;
    ctx.beginPath(); for (let i = 0; i < 8; i++) { const rad = i % 2 === 0 ? r : r * 0.25, a = i * Math.PI / 4; const px = Math.cos(a) * rad, py = Math.sin(a) * rad; if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  function glass(x, y, w, h, r, o) {
    o = o || {};
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.75)'; ctx.shadowBlur = o.blur || 50; ctx.shadowOffsetY = 20; rr(ctx, x, y, w, h, r); ctx.fillStyle = 'rgba(14,19,32,.7)'; ctx.fill(); ctx.restore();
    ctx.save(); rr(ctx, x, y, w, h, r); ctx.clip();
    const g = ctx.createLinearGradient(x, y, x + w, y + h);
    g.addColorStop(0, 'rgba(255,255,255,' + (o.a || 0.14) + ')'); g.addColorStop(0.5, 'rgba(168,230,255,.07)'); g.addColorStop(1, 'rgba(196,181,253,.11)');
    ctx.fillStyle = g; ctx.fillRect(x, y, w, h); ctx.restore();
    rr(ctx, x, y, w, h, r); ctx.strokeStyle = o.stroke || 'rgba(255,255,255,.28)'; ctx.lineWidth = o.lw || 2; ctx.stroke();
  }
  function txt(s, x, y, font, fill, glow, align) {
    ctx.save(); ctx.font = font; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
    if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 18; } ctx.fillStyle = fill; ctx.fillText(s, x, y); ctx.restore();
  }
  function mix(a, b, t) { return `rgb(${Math.round(lerp(a[0], b[0], t))},${Math.round(lerp(a[1], b[1], t))},${Math.round(lerp(a[2], b[2], t))})`; }
  function ribbons(t) {
    const th = (t / T) * TAU;
    ctx.save();
    const bg = ctx.createRadialGradient(CX + Math.sin(th) * 55, CY + Math.cos(th) * 45, 40, CX, CY, 620);
    bg.addColorStop(0, 'rgba(168,230,255,.17)'); bg.addColorStop(0.45, 'rgba(196,181,253,.11)'); bg.addColorStop(0.75, 'rgba(245,194,231,.05)'); bg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = bg; ctx.fillRect(0, 320, 1080, 1120);
    ctx.filter = 'blur(44px)'; ctx.globalCompositeOperation = 'screen';
    const rb = [
      { a: 'rgba(168,230,255,.62)', b: 'rgba(125,211,252,.15)', y: 630, a1: 115, a2: 85, o: 0, w: 130 },
      { a: 'rgba(245,194,231,.56)', b: 'rgba(251,207,232,.15)', y: 880, a1: -125, a2: 95, o: 2.1, w: 145 },
      { a: 'rgba(196,181,253,.58)', b: 'rgba(167,139,250,.16)', y: 1120, a1: 95, a2: -115, o: 4.2, w: 130 }];
    for (const r of rb) {
      const p = th + r.o;
      const g = ctx.createLinearGradient(0, r.y - 150, 1080, r.y + 150); g.addColorStop(0, r.b); g.addColorStop(0.5, r.a); g.addColorStop(1, r.b);
      ctx.strokeStyle = g; ctx.lineWidth = r.w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-120, r.y + Math.sin(p) * r.a1);
      ctx.bezierCurveTo(340 + Math.cos(p) * 90, r.y + Math.cos(p + 0.8) * r.a2, 740 + Math.sin(p) * 90, r.y + Math.sin(p - 0.8) * r.a1, 1200, r.y + Math.cos(p) * r.a2); ctx.stroke();
    }
    ctx.restore();
  }
  const N = 7200, TR = [];
  (function () {
    const a = 0.95, b = 0.7, c = 0.6, d = 3.5, e = 0.25, f = 0.1, dt = 0.01;
    let x = 0.1, y = 0, z = 0;
    for (let i = 0; i < N + 2000; i++) {
      const dx = (z - b) * x - d * y, dy = d * x + (z - b) * y, dz = c + a * z - z * z * z / 3 - (x * x + y * y) * (1 + e * z) + f * z * x * x * x;
      x += dx * dt; y += dy * dt; z += dz * dt; if (i >= 2000) TR.push([x, y, z - 0.35]);
    }
  })();
  function proj(p, ang) {
    const ca = Math.cos(ang), sa = Math.sin(ang), x1 = p[0] * ca - p[1] * sa, y1 = p[0] * sa + p[1] * ca, pt = 1.0, cp = Math.cos(pt), sp = Math.sin(pt);
    const y2 = y1 * cp - p[2] * sp, z2 = y1 * sp + p[2] * cp, k = 5 / (5 - z2 * 0.9);
    return [CX + x1 * 400 * k, CY - 20 - y2 * 400 * k, z2];
  }
  function draw(t) {
    const fade = eio(t / 0.3) * (1 - eio((t - 4.8) / 1.2)), head = Math.floor(clamp(eio(t / 3.2), 0, 1) * (N - 1)), ang = 0.6 + t * 0.7, L = 4200, st = Math.max(0, head - L);
    if (fade <= 0.003) return;
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
    const P = []; for (let i = st; i <= head; i++) P.push(proj(TR[i], ang));
    for (const pass of [0, 1]) {
      for (let s0 = 0; s0 < P.length - 1; s0 += 40) {
        const age = (s0 + 20) / Math.max(1, P.length), idx = st + s0, hue = (idx / 380) % 3, c = hue < 1 ? [168, 230, 255] : hue < 2 ? [196, 181, 253] : [245, 194, 231];
        ctx.beginPath(); ctx.moveTo(P[s0][0], P[s0][1]); for (let j = s0 + 1; j <= Math.min(s0 + 40, P.length - 1); j++) ctx.lineTo(P[j][0], P[j][1]);
        ctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},${(pass ? 0.9 : 0.14) * Math.pow(age, 1.4) * fade})`; ctx.lineWidth = pass ? 1.8 : 6; ctx.stroke();
      }
    }
    const h = P[P.length - 1], gr = ctx.createRadialGradient(h[0], h[1], 0, h[0], h[1], 38); gr.addColorStop(0, 'rgba(255,255,255,' + fade + ')'); gr.addColorStop(0.3, 'rgba(168,230,255,' + 0.7 * fade + ')'); gr.addColorStop(1, 'rgba(168,230,255,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(h[0], h[1], 38, 0, TAU); ctx.fill();
    ctx.restore();
  }
  const PH = [[3.2, 6, 'TRACE ATTRACTOR'], [4.8, 5, 'ROTATE 3D'], [5.4, 7, 'FADE BACK'], [6, 0, 'LOOP RESET']];
  function updateCode(t) {
    let t0 = 0, l0 = 0, lineF = 0, label = PH[0][2];
    for (const [te, le, lb] of PH) { if (t <= te) { lineF = l0 + (le - l0) * eio((t - t0) / (te - t0)); label = lb; break; } t0 = te; l0 = le; }
    hl.style.transform = `translateY(${lineF * 31}px)`; badge.textContent = label;
    const a = Math.round(lineF); for (let i = 0; i < lineEls.length; i++) lineEls[i].style.opacity = i === a ? '1' : '0.58';
  }
  window.renderAt = function (tin) {
    let t = Number(tin) % T; if (t < 0) t += T;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
    ctx.clearRect(0, 0, 1080, 1920);
    ribbons(t);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
    draw(t);
  };
  window.renderAt(0);
  function loop(now) { if (!window.__RENDER_MODE) window.renderAt((now / 1000) % 10); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
})();

  </script>
<script>
function makeCodeWindow(CODE_SRC,DUR,T0,T1){
  const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
  const sm=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};
  const codeEl=document.getElementById('code'),hl=document.getElementById('hl'),fadeEl=document.getElementById('fade');
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const TOKS=[];{const re=/(\/\/.*)|('[^']*'|"[^"]*"|`[^`]*`)|\b(const|let|for|of|if|else|return|function|new|import|from|export|await|async)\b|\b(\d+\.?\d*)\b|([A-Za-z_]\w*)(?=\()|(\w+)|(\s+|.)/g;let m;
  while((m=re.exec(CODE_SRC))){const c=m[1]?'cm':m[2]?'s':m[3]?'k':m[4]?'n':m[5]?'f':m[6]?'v':'p';TOKS.push([c,m[0]])}}
  const LH=40,CTOP=68,VIS=9,N=CODE_SRC.length;
  const LS=[0];for(let i=0;i<N;i++)if(CODE_SRC[i]==='\n')LS.push(i+1);
  return function(t){
    const n=Math.floor(N*clamp((t-T0)/(T1-T0)));
    let left=n,h='';
    for(const[c,s]of TOKS){if(left<=0)break;const part=s.slice(0,left);left-=part.length;h+='<span class="'+c+'">'+esc(part)+'</span>'}
    codeEl.innerHTML=h+((n<N||Math.floor(t*2)%2===0)?'<span class="cr"></span>':'');
    let line=0;for(let k=0;k<LS.length;k++)if(LS[k]<=n)line=k;
    let sc=0;for(let k=VIS;k<LS.length;k++){const tk=T0+(T1-T0)*LS[k]/N;sc+=sm(tk,tk+.22,t)}
    codeEl.style.transform='translateY('+(-sc*LH)+'px)';
    hl.style.top=(CTOP+(line-sc)*LH)+'px';
    fadeEl.style.opacity=1-Math.min(sm(0,.35,t),sm(0,.35,DUR-t));
  };
}

(function(){
  const inner=window.renderAt,DUR=10,T0=.4,T1=7.4,HERO=4.8,HOLD=5.3;
  const cw=makeCodeWindow("const [a, b, c, d, e, f] =\n  [0.95, 0.7, 0.6, 3.5, 0.25, 0.1];\nfunction step(p, dt) {\n  const { x, y, z } = p;\n  return {\n    x: x + ((z - b) * x - d * y) * dt,\n    y: y + (d * x + (z - b) * y) * dt,\n    z: z + (c + a * z - z ** 3 / 3\n      - (x * x + y * y) * (1 + e * z)\n      + f * z * x ** 3) * dt,\n  };\n}\nlet p = { x: 0.1, y: 0, z: 0 };\nfor (let i = 0; i < 9000; i++) {\n  p = step(p, 0.005);\n  trail.push(project(p));\n}\ncamera.orbit(t * 0.4);",DUR,T0,T1);
  const clamp=(x)=>Math.min(1,Math.max(0,x));
  window.renderAt=function(tIn){
    let T=Number(tIn)%DUR;if(T<0)T+=DUR;
    let st=clamp((T-T0)/(T1-T0))*HERO;
    if(T>T1)st=Math.min(HOLD,HERO+(T-T1)*(HOLD-HERO)/2.2);
    inner(st);cw(T);
  };
  window.renderAt(0);
  Promise.all([document.fonts.load("700 90px Oswald"),document.fonts.load("400 30px JBM")]).catch(()=>{}).then(()=>{window.renderAt(0);window.__ready=true});
})();
</script>
